services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: himalayan_spring
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_password
    ports:
      - "5432:5432"
    volumes:
      - himalayan_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d himalayan_spring"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  himalayan_postgres:
