services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: himalayan_spring
      MYSQL_USER: app
      MYSQL_PASSWORD: app_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - himalayan_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uapp", "-papp_password"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  himalayan_mysql:
