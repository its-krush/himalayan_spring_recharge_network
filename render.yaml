databases:
  - name: himalayan-spring-db
    databaseName: himalayan_spring
    user: app
    plan: free

services:
  - type: web
    name: himalayan-spring-recharge-network
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm db:migrate && pnpm start
    healthCheckPath: /api/trpc/system.health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENABLE_LIVE_INGESTION
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: himalayan-spring-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: VITE_APP_ID
        sync: false
      - key: OAUTH_SERVER_URL
        value: https://api.manus.im
      - key: VITE_OAUTH_PORTAL_URL
        sync: false
      - key: OWNER_OPEN_ID
        sync: false
      - key: OWNER_NAME
        sync: false
